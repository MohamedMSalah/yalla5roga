name: Places weekly synchronization
on:
  schedule:
    # Hourly checks avoid daily rounding extending a seven-day deadline to eight days.
    # PostgreSQL gates the expensive import to seven days since full success.
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: places-osm-sync
  cancel-in-progress: false
jobs:
  synchronize:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Run protected due worker
        env:
          API_URL: ${{ secrets.PLACES_SYNC_API_URL }}
          WORKER_SECRET: ${{ secrets.PLACES_SYNC_WORKER_SECRET }}
        shell: bash
        run: |
          test -n "$API_URL" && test -n "$WORKER_SECRET"
          case "$API_URL" in https://*) ;; *) exit 1 ;; esac
          curl --fail-with-body --silent --show-error --max-time 3000 \
            --request POST --header "Authorization: Bearer $WORKER_SECRET" \
            --header 'Content-Type: application/json' --data '{}' \
            "$API_URL/api/places/sync/worker"

name: yalla_5roga
description: >-
  Yalla 5roga helps friends in Egypt plan group outings together —
  create groups, vote on places, discover spots, chat about plans,
  and save drafts for the next outing.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  device_info_plus: ^13.2.0
  flutter_localization: ^0.4.1
  provider: ^6.1.5
  google_fonts: ^6.3.2
  get: ^4.7.3
  package_info_plus: ^10.2.1
  flutter_svg: ^2.0.7
  http: ^1.6.0
  dio: ^5.9.0
  dartz: ^0.10.1
  equatable: ^2.0.7
  shared_preferences: ^2.5.3
  connectivity_plus: ^7.0.0
  image_picker: ^1.2.0
  url_launcher: ^6.3.2
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  geolocator: ^14.0.2
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  permission_handler: ^13.0.2
  flutter_contacts: ^2.5.0
  firebase_messaging: ^16.7.0
  flutter_local_notifications: ^22.3.1
  firebase_crashlytics: ^5.4.0
  firebase_performance: ^0.11.6
  firebase_analytics: ^12.6.0
  google_sign_in: 6.3.0
  sign_in_with_apple: ^8.2.0
  crypto: ^3.0.7
  cached_network_image: ^4.0.4
  mockito: ^5.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  build_runner: ^2.4.15

flutter:
  generate: false
  uses-material-design: true
  assets:
    - assets/branding/
    - shorebird.yaml

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
